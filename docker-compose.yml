services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_autonomo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=gestao_autonomo;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: gestao-autonomo
      Jwt__Audience: gestao-autonomo-clients
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in your .env file to a long random secret}
      Jwt__ExpiresMinutes: "120"
      # Origem do frontend que pode chamar a API via browser (CORS). Um proxy reverso
      # externo é quem expõe isso publicamente em api.gtlabs.com.br; a API só precisa
      # saber de onde aceitar requisições cross-origin.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-https://app.gtlabs.com.br}
    ports:
      # Publicado para o proxy reverso externo alcançar via localhost:8080.
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite embute isso no bundle em build-time — precisa ser a URL pública da API
        # (a que o navegador do usuário final vai chamar), não um nome de serviço interno.
        VITE_API_URL: ${API_ORIGIN:-https://api.gtlabs.com.br}
    restart: unless-stopped
    ports:
      # Publicado para o proxy reverso externo alcançar via localhost:8081.
      - "8081:80"

volumes:
  postgres_data:
