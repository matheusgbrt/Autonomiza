name: Publish Docker images

on:
  push:
    branches: [master]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push-api:
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            matheusgbrt/gestao-autonomo-api:latest
            matheusgbrt/gestao-autonomo-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # Vite embute isso no bundle em build-time — precisa ser a URL pública da API
          # que o navegador do usuário final vai chamar (mesma lógica do docker-compose.yml).
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.controleautonomo.gtlabs.com.br' }}
          tags: |
            matheusgbrt/gestao-autonomo-frontend:latest
            matheusgbrt/gestao-autonomo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
